[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "securevault"
version = "1.0.0"
description = "Hybrid file encryption (AES-256-GCM + RSA-OAEP) with a streaming, tamper-evident format."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["cryptography", "encryption", "aes-gcm", "rsa", "hybrid-encryption", "security"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security :: Cryptography",
  "Typing :: Typed",
]
dependencies = ["cryptography>=42.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy"]

[project.scripts]
securevault = "securevault.cli:main"

[project.urls]
Homepage = "https://github.com/YOUR-USERNAME/securevault"
Issues = "https://github.com/YOUR-USERNAME/securevault/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
securevault = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["UP006", "UP007", "UP035", "UP045"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.9"
disallow_untyped_defs = true
warn_unused_ignores = true
files = ["src"]
